name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A required reviewer approves before this runs, so a pushed tag is not
    # itself the publish decision.
    environment: release
    permissions:
      # `write`, not `read`: a DRAFT release is invisible to a caller without
      # push access, so under `contents: read` the listing below comes back
      # empty and the gate reports "no release" for a draft sitting right
      # there with its notes in it.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # A mistyped tag, a forgotten version bump or an un-cut changelog must
      # not publish the wrong version. Both checks run before anything is
      # built, so a failure costs nothing.
      - name: Verify version and changelog match the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${TAG//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section; cut it from [Unreleased] before tagging."
            exit 1
          fi

      # The notes must exist BEFORE the registry gets the package. Found by
      # listing rather than `gh release view <tag>`: a draft's tag is not a git
      # ref, so addressing one by tag can match nothing, change nothing, and
      # still exit 0.
      - name: A release exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            | jq -cs --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)] | first // empty')"
          if [ -z "$release" ]; then
            echo "::error::No release for $GITHUB_REF_NAME. Write its notes first."
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""')"
          if [ "${#body}" -lt 200 ]; then
            echo "::error::The release body for $GITHUB_REF_NAME is ${#body} bytes. Write the notes before publishing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Publish authenticates via the NPM_TOKEN repo secret, a granular token
      # with read/write on the @markup-carve scope. setup-node already wrote
      # the registry .npmrc; NODE_AUTH_TOKEN supplies the credential.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # A registry publish is not finished until the release page exists. The
      # tag is pushed, CI publishes, the registry answers 200, and "released"
      # feels done - while `/releases` still shows a draft, so a reader has no
      # notes for the version they just installed.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed publish is not.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            | jq -cs --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)] | first // empty')"
          id="$(printf '%s' "$release" | jq -r 'select(.draft) | .id // empty')"
          if [ -z "$id" ]; then
            echo "The release is already published."
            exit 0
          fi
          # `tag_name` goes with every PATCH of a release. Omit it on a DRAFT
          # and GitHub replaces the tag with a generated `untagged-*`
          # placeholder, because a draft's tag is a string on the object rather
          # than a git ref, so the field has nothing to fall back to.
          # `-F` (not `-f`) for draft, so it is sent as a boolean and not the
          # string "false", which reads as true.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false --jq '"published \(.tag_name)"'
          # Read it back: exit status does not say whether the tag survived.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"draft=\(.draft) tag=\(.tag_name)"'
