name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # A floor, not a target: it fails when a change drops coverage, and says
      # nothing about a change that keeps it.
      - run: node --test --experimental-test-coverage --test-coverage-lines=0.85 --test-coverage-branches=0.80 test/*.test.js

  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chrome refuses to start when it cannot set up its sandbox, and on this
    # runner it cannot: the installed binary's SUID helper is not setuid root.
    # Measured in run 37031038286, where a sandboxed launch of the preinstalled
    # Chrome and of the freshly installed one both opened no debugging port,
    # and the same launch with --no-sandbox answered on /json/version.
    env:
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # pdfinfo and pdftotext, for the PDF regression check below.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # The deck, PDF and contrast checks all drive a headless browser. The job
      # used to inherit whichever one the runner image happened to carry, and
      # went red on main when that browser stopped starting. So it installs its
      # own and says where it is.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm run build
      - run: node scripts/build-site.mjs site
      # Opens every built deck in a browser and fails on what a reader would see:
      # unrendered markup, a diagram whose renderer never drew, a slide that
      # overflows, an error slide.
      - run: node scripts/check-decks.mjs site
      # Page counts and text per deck, against the stored numbers. This is what
      # notices an agenda that overran its slide, which the HTML cannot show.
      - run: node scripts/check-pdf.mjs site
      # Computed colors out of the same browser, for the one thing the CSS text
      # cannot show: whether a highlight is readable in either deck variant.
      - run: npm run check:contrast
