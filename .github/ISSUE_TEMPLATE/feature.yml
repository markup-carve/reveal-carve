name: Feature
description: Something the plugin should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The deck you want to build, not the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you work around it today
    validations:
      required: false
